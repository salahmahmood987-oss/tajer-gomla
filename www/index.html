<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تاجر جملة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#047857"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== تاجر جملة — ستايل v2.8.0: شكل «تاجر جملة» (أخضر زمردي + كحلي غامق + كهرماني) على نفس وظائف جملة ماركت ===== */
:root{
  --bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--mute:#64748b;
  --teal:#047857;--teal2:#059669;--teald:#065f46;
  --tom:#dc2626;--tom2:#ef4444;--tomd:#991b1b;
  --green:#059669;--blue:#0284c7;--amber:#d97706;
  --line:#e2e8f0;--soft:#ecfdf5;--edge:#cbd5e1;--edge3d:#94a3b8;
  --lime:#fbbf24;
  --sh1:0 2px 0 rgba(15,23,42,.04),0 14px 28px rgba(15,23,42,.14);
  --sh2:0 3px 0 rgba(15,23,42,.06),0 22px 44px rgba(15,23,42,.20);
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;padding-bottom:112px;
  background:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -8%,#ffffff,transparent 62%);
  background-attachment:fixed}
#app{max-width:720px;margin:auto;padding:14px 16px 8px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}

/* ===== الهيدر ===== */
.topbar{background:linear-gradient(90deg,#065f46,#0f766e,#065f46);color:#fff;font-size:12.5px;font-weight:700;text-align:center;padding:9px 12px;border-radius:14px;margin-bottom:10px;line-height:1.7;box-shadow:0 3px 0 #064e3b}
.topbar b{color:#fcd34d}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 14px;
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  box-shadow:0 4px 0 var(--edge),0 12px 22px rgba(15,23,42,.08)}
.brand .logo{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg,#10b981,#047857);color:#fff;
  box-shadow:0 4px 0 #065f46,0 10px 16px rgba(4,120,87,.25)}
.brand b{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:900;line-height:1.1;color:var(--ink)}
.b2b{font-size:11px;font-weight:800;color:#047857;background:#d1fae5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:999px}
.brand small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ===== التبويبات ===== */
.nav{display:flex;gap:8px;margin:4px 0 14px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;gap:7px;min-height:52px;padding:10px 16px;
  border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  font-size:16px;font-weight:700;
  box-shadow:0 4px 0 var(--edge3d),0 8px 16px rgba(15,23,42,.12);
  transition:transform .08s,box-shadow .08s,background .12s,color .12s,border-color .12s}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge3d)}
.nav button.on{background:linear-gradient(180deg,#10b981,#047857);color:#fff;border-color:transparent;
  box-shadow:0 5px 0 #065f46,0 12px 20px rgba(4,120,87,.30)}
.nav button.on:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teald)}
.nav button .ic{font-size:18px;line-height:1}
.nav button[data-out]{margin-inline-start:auto;color:var(--tom)}
.cats button{flex:1 0 84px;flex-direction:column;gap:6px;min-height:88px;padding:12px 8px;font-size:14.5px;text-align:center;justify-content:center}
.cic{font-size:30px;line-height:1}

/* ===== الكروت ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--sh1);border-bottom:5px solid var(--edge3d)}
.card b{font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.big{font-size:24px;font-weight:800;color:var(--teal)}
.big s{font-size:15px;color:var(--mute);font-weight:400}
.mute{color:var(--mute);font-size:13.5px;line-height:1.6}
h3{margin:22px 0 8px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--ink)}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
a{color:var(--teal2);font-weight:700;text-decoration:none}

/* ===== الشارات ===== */
.tag{display:inline-block;color:var(--tom);background:var(--soft);background:color-mix(in srgb,var(--tom) 10%,transparent);
  font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px}
.tag.st-delivered{color:var(--green);background:var(--soft);background:color-mix(in srgb,var(--green) 12%,transparent)}
.tag.st-rejected{color:var(--tom);background:var(--soft);background:color-mix(in srgb,var(--tom) 12%,transparent)}
.tag.st-out{color:var(--amber);background:var(--soft);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.tag.st-preparing{color:var(--blue);background:var(--soft);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.tag.st-received{color:var(--mute);background:var(--soft)}
.stock{display:inline-block;font-size:12.5px;font-weight:700;color:var(--green);
  background:var(--soft);background:color-mix(in srgb,var(--green) 12%,transparent);
  padding:4px 11px;border-radius:999px;margin:5px 0}
.stock.low{color:var(--amber);background:var(--soft);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.stock.out{color:var(--tom);background:var(--soft);background:color-mix(in srgb,var(--tom) 12%,transparent)}

/* ===== الأزرار ===== */
.btn{width:100%;min-height:52px;padding:13px;border:0;border-radius:12px;
  background:linear-gradient(180deg,#10b981,#047857);color:#fff;font-weight:800;font-size:17px;margin-top:8px;
  box-shadow:0 5px 0 #065f46,0 12px 20px rgba(4,120,87,.22);
  transition:transform .08s,box-shadow .08s,filter .12s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--teald);filter:brightness(.96)}
.btn.red{background:linear-gradient(180deg,#f05652,#e53935);box-shadow:0 5px 0 var(--tomd),0 12px 20px rgba(229,57,53,.30)}
.btn.red:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--tomd);filter:brightness(.96)}
.btn.ghost{background:var(--card);color:var(--mute);border:1px solid var(--line);box-shadow:0 4px 0 var(--edge3d),0 6px 12px rgba(15,23,42,.10)}
.btn.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge3d)}
.btn:disabled{opacity:.5}

/* ===== الحقول ===== */
input,select,textarea{width:100%;padding:12px 14px;margin:6px 0;border:1.5px solid #d5dee5;border-radius:12px;
  background:var(--card);color:var(--ink);font:inherit;font-size:16px;
  box-shadow:inset 0 2px 6px rgba(11,43,58,.06);
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal2);
  box-shadow:0 0 0 3px rgba(25,118,210,.18),inset 0 2px 6px rgba(11,43,58,.06)}
.card label.mute{display:block;margin-top:12px;font-weight:700;color:var(--ink)}
.card label.mute:first-child{margin-top:0}
input[type=checkbox]{width:auto;accent-color:var(--teal2)}
input[type=file]{padding:10px}

/* ===== التنبيهات ===== */
.warn{background:var(--soft);border:1px solid var(--line);padding:12px 14px;border-radius:12px;
  font-size:14px;margin:10px 0;line-height:1.7}

/* ===== شريط السلة العائم ===== */
.bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:10px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);border-bottom:5px solid var(--edge3d)}
.bar .btn{max-width:720px;display:block;margin:auto;background:linear-gradient(180deg,#1e293b,#0f172a);box-shadow:0 5px 0 #020617,0 12px 20px rgba(15,23,42,.25)}
.bar .btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #020617}

/* ===== النوافذ المنبثقة ===== */
dialog{width:min(560px,calc(100% - 24px));max-height:88vh;margin:auto auto 12px;
  border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);
  padding:8px 18px 18px;font-family:inherit;box-shadow:var(--sh2);animation:rise .2s ease}
dialog::backdrop{background:rgba(15,23,42,.55)}
dialog::before{content:"";display:block;width:46px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 14px}
dialog h2{margin:0 0 10px;font-size:20px;font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== المنتجات ===== */
.pimg{display:block;width:100%;height:180px;object-fit:contain;border-radius:12px;
  background:linear-gradient(160deg,#ffffff,#eef4f7);box-shadow:var(--sh1);margin-bottom:10px}
.ico{width:84px;height:84px;border-radius:18px;display:grid;place-items:center;font-size:44px;margin-bottom:10px;
  background:linear-gradient(145deg,#ffffff,#e8f0f4);color:var(--ink);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.9),0 6px 14px rgba(11,43,58,.14);border-bottom:3px solid var(--edge3d)}
.qty{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 4px}
.qty button{width:52px;height:52px;border-radius:50%;border:0;font-size:30px;line-height:1;color:#fff;
  background:linear-gradient(180deg,#10b981,#047857);box-shadow:0 4px 0 #065f46,0 10px 16px rgba(4,120,87,.30);
  transition:transform .08s,box-shadow .08s,filter .12s}
.qty button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #065f46;filter:brightness(.94)}
.qty button:disabled{opacity:.35}
.qty b{min-width:48px;text-align:center;font-size:26px;font-weight:800}

/* ===== شاشة الدخول وبانر التثبيت ===== */
.auth{margin-top:16px}
.auth .btn{margin-top:12px}
#inst{max-width:720px;margin:12px auto;padding:16px}

/* ===== قائمة طلبات مدمجة ===== */
.ord{padding:14px 16px;margin-bottom:12px;border-bottom:0;
  box-shadow:0 5px 0 var(--edge3d),0 18px 30px rgba(15,23,42,.16)}
.ord .orow:first-child{margin-bottom:4px}
.ord a.mapbtn{display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#10b981,#047857);color:#fff;font-weight:800;font-size:14.5px;
  padding:9px 14px;border-radius:11px;
  box-shadow:0 3px 0 #065f46,0 8px 14px rgba(4,120,87,.25);
  transition:transform .08s,box-shadow .08s}
.ord a.mapbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #065f46}
.ord a[href^="tel:"]{color:inherit;text-decoration:underline}
.ord a.callbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:linear-gradient(180deg,#10b981,#047857);color:#fff;font-size:20px;text-decoration:none;
  box-shadow:0 3px 0 #065f46,0 8px 14px rgba(4,120,87,.25);flex:none}
.ord a.callbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #065f46}
.orow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.orow b{font-size:16px}
.ototal{margin-inline-start:auto;font-size:19px;font-weight:800;white-space:nowrap;color:var(--teal)}
.oitems{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selrow{flex:1 1 100%;display:flex;gap:8px;min-width:0;margin-top:8px}
.selrow select{flex:1;min-width:0;margin:2px 0;padding:9px 8px;font-size:15px;font-weight:700;
  background:linear-gradient(180deg,#ffffff,#f1f5f9);border:1.5px solid #cbd5e1;
  box-shadow:0 3px 0 var(--edge3d),0 6px 12px rgba(15,23,42,.10)}
/* ===== تفاصيل الطلب: صف صنف بصورة ===== */
.ord{cursor:pointer}
.oitem{align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.oit{width:56px;height:56px;object-fit:cover;border-radius:12px;border:1px solid var(--line);box-shadow:0 3px 0 var(--edge3d);flex:none}
.oit.ico{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,#fff,#e8f0f4)}
.cav{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--edge3d);background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:30px}
.cav img{width:100%;height:100%;object-fit:cover}
.ord .btn{min-height:48px;margin-top:6px}

/* ===== شبكة المنتجات (زي التطبيق المرجعي) ===== */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.prod{padding:0;overflow:hidden;display:flex}
.prow{flex:1;display:flex;flex-direction:column;gap:0;align-items:stretch}
.prod .pimg{width:100%;height:180px;flex:none;margin:0;border-radius:0;object-fit:contain;background:#fff}
.prod .ico{width:100%;height:180px;flex:none;margin:0;font-size:56px;border-radius:0;background:#fff}
.pinfo{flex:1;min-width:0;padding:10px 12px 0;display:flex;flex-direction:column}
.pinfo b{order:3;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pinfo .mute{order:2;line-height:1.6}
.pinfo .stock{margin:0;vertical-align:middle}
.prow2{order:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pprice{font-size:22px;font-weight:800;white-space:nowrap;color:var(--teal)}
.pmedia{position:relative}
.pcat{position:absolute;top:10px;right:10px;background:rgba(4,120,87,.92);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.old{font-size:13px;color:var(--mute);white-space:nowrap}
.prow2 .tag{white-space:normal;line-height:1.5}
.pact{flex:none;padding:10px 12px 12px}
.prod .btn{width:100%;height:48px;min-height:48px;padding:0 12px;margin:0;font-size:15px;border-radius:12px;background:linear-gradient(180deg,#1e293b,#0f172a);box-shadow:0 4px 0 #020617,0 10px 16px rgba(15,23,42,.25)}
.prod .btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #020617}
.prod .qty{gap:8px;margin:0}
.prod .qty button{width:38px;height:38px;font-size:22px}
.prod .qty button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #065f46}
.prod .qty b{min-width:26px;font-size:18px}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a,#134e4a 70%,#065f46);color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:14px;box-shadow:0 6px 0 rgba(2,6,23,.5),0 16px 28px rgba(15,23,42,.28)}
.hero-badge{display:inline-block;background:rgba(16,185,129,.22);color:#6ee7b7;border:1px solid rgba(16,185,129,.4);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:12px}
.hero h2{margin:0 0 10px;font-size:23px;font-weight:900;line-height:1.45;color:#fff}
.hero h2 span{color:#34d399}
.hero p{margin:0 0 14px;color:#cbd5e1;font-size:14px;line-height:1.8}
.hero p b{color:#fcd34d}
.hgar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.hgar span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700}
.hero-note{background:rgba(16,185,129,.25);border:1px solid rgba(16,185,129,.4);color:#a7f3d0;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;text-align:center}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:14px;box-shadow:var(--sh1)}
.searchbar span{font-size:18px}
.searchbar input{border:0;box-shadow:none;margin:0;padding:10px 0}
.searchbar input:focus{box-shadow:none}
.deals{font-size:19px;font-weight:800;color:var(--ink);margin:4px 0 12px}
.deals .cnt{font-size:13px;color:var(--mute);font-weight:600}
.foot{margin-top:22px;background:#0f172a;color:#94a3b8;border-radius:18px;padding:18px;text-align:center;line-height:1.8}
.foot b{display:block;color:#fff;font-size:17px;margin-bottom:4px}
.foot span{font-size:12.5px}
.foot small{display:block;margin-top:8px;font-size:11.5px;color:#64748b}

/* ===== مقاسات أنسب للتليفون ===== */
@media(max-width:400px){
  #app{padding:12px 12px 8px}
  .brand{padding:14px}
  .brand .logo{width:48px;height:48px;font-size:28px}
  .nav button{min-height:46px;padding:10px 14px}
  .ord{padding:12px}
}

// تثبيت تحديث الـ APK في التطبيق الأصلي (زي ind toktok): تحميل + تحقق SHA-256 + فتح مثبّت أندرويد.
async function installApkUpdate(apkUrl,expectedSha256){
 const C=window.Capacitor;if(!C||!C.Plugins)return alert("التحديث متاح من المتصفح بس.");
 const FS=C.Plugins.Filesystem,FO=C.Plugins.FileOpener;
 if(!FS||!FO)return alert("التحديث مش متاح في النسخة دي.");
 const btn=document.querySelector("[data-upd]");
 if(btn){btn.disabled=true;btn.textContent="بيحمّل التحديث…"}
 let listener=null;
 try{
  try{listener=await FS.addListener("progress",p=>{if(p.contentLength>0&&btn)btn.textContent=`بيحمّل التحديث… ${Math.round(p.bytes/p.contentLength*100)}%`})}catch(e){}
  try{await FS.deleteFile({path:"tajer-gomla-update.apk",directory:"CACHE"})}catch(e){}
  const res=await FS.downloadFile({url:apkUrl,path:"tajer-gomla-update.apk",directory:"CACHE",progress:true});
  if(expectedSha256){
   const f=await FS.readFile({path:"tajer-gomla-update.apk",directory:"CACHE"});
   const actual=await sha256HexOfBase64(typeof f.data==="string"?f.data:"");
   if(actual&&actual.toLowerCase()!==expectedSha256.toLowerCase()){alert("الملف اللي اتحمّل مش سليم — جرّب «حدّث دلوقتي» تاني.");return}
  }
  let filePath=res.path||"";
  if(!filePath.startsWith("/")){const u=await FS.getUri({path:"tajer-gomla-update.apk",directory:"CACHE"});filePath=u.uri.replace(/^file:\/\//,"")}
  dlg.close();
  await FO.open({filePath,contentType:"application/vnd.android.package-archive"});
 }catch(e){alert("تعذر تحميل التحديث — تأكد من النت وجرب «حدّث دلوقتي» تاني.")}
 finally{try{if(listener)await listener.remove()}catch(e){}}
}
async function sha256HexOfBase64(b64){
 try{
  const subtle=globalThis.crypto&&globalThis.crypto.subtle;if(!subtle)return null;
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const hash=await subtle.digest("SHA-256",bytes);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
 }catch(e){return null}
}
